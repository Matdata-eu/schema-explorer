openapi: 3.0.3
info:
  title: Pets
  version: 1.0.0
  description: A small pet store.
paths:
  /pets:
    get:
      responses:
        200:
          description: The pets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, nullable: true, example: Rex }
        tag: { type: string }
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            bark: { type: boolean }
    Pets:
      type: array
      items: { $ref: '#/components/schemas/Pet' }
      maxItems: 100
