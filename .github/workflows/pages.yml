name: Pages

# Publishes the viewer on GitHub Pages:
# https://matdata-eu.github.io/schema-explorer/
# with an examples catalog of freely redistributable schemas only: NeTEx,
# ERA TAF/TAP TSI, legacy RINF, OASIS UBL 2.4 and the W3C schema for schemas are fetched
# from their publishers and pre-indexed here (see scripts/build-examples.sh). railML and other non-redistributable schemas are
# never published.

# Deployed only for releases, so the site always matches a released version
# (the version is set from the release tag during the build). The
# github-pages environment must allow deployments from tags matching v*.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (empty for the latest release)
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Use the release version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/set-version.sh "${TAG#v}"
      - uses: ./.github/actions/build-web
      - name: Cache the example downloads
        uses: actions/cache@v6
        with:
          path: tests/fixtures/downloads
          key: examples-${{ hashFiles('scripts/build-examples.sh') }}
      - name: Build the examples (fetched at build time)
        run: |
          cargo build --release --locked -p schema-explorer
          scripts/build-examples.sh ./target/release/schema-explorer web/dist
      - name: Add the notices
        run: |
          cp THIRD_PARTY_NOTICES.md web/dist/
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
