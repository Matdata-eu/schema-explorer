name: Pages

# Publishes the viewer on GitHub Pages:
# https://matdata-eu.github.io/schema-explorer/
# with an examples catalog of freely redistributable schemas only: NeTEx is
# cloned from its public repository and pre-indexed here (see
# scripts/build-examples.sh). railML and other non-redistributable schemas are
# never published.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-web
      - name: Build the examples (NeTEx, fetched at build time)
        run: |
          cargo build --release --locked -p schema-explorer
          scripts/build-examples.sh ./target/release/schema-explorer web/dist
      - name: Add the notices
        run: |
          cp THIRD_PARTY_NOTICES.md web/dist/
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
